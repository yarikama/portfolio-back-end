services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/
      - ./.env.local:/app/.env:ro
    depends_on:
      - db
      - redis

  # Rate limits; set REDIS_URL=redis://redis:6379/0 in .env.local to use it.
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  # The same major version as production (CloudNativePG).
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      # A new name for 17: Postgres can't open the old volume's 16 data.
      - postgres17_data:/var/lib/postgresql/data

volumes:
  postgres17_data:
